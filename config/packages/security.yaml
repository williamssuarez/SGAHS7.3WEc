security:
    role_hierarchy:
        # Base roles
        ROLE_EXTERNAL: ROLE_USER
        ROLE_INTERNAL: ROLE_USER

        # Base Staff Roles
        ROLE_RECEPTIONIST: ROLE_INTERNAL
        ROLE_NURSE: ROLE_INTERNAL
        ROLE_DOCTOR: ROLE_INTERNAL

        # Module Access Roles
        ROLE_ER: ROLE_USER
        ROLE_OR: ROLE_USER
        ROLE_HOSPITALIZATION: ROLE_USER

        # Specialized Staff Roles (Combines Staff Base + Module Permissions)
        ROLE_ER_NURSE: [ROLE_NURSE, ROLE_ER]
        ROLE_ER_DOCTOR: [ROLE_DOCTOR, ROLE_ER]
        ROLE_ANESTHESIOLOGIST: [ROLE_DOCTOR, ROLE_OR]
        ROLE_SURGEON: [ROLE_DOCTOR, ROLE_OR]
        ROLE_ADMIN_QUIROFANO: [ROLE_SURGEON, ROLE_ANESTHESIOLOGIST]

        # The Boss gets everything
        ROLE_ADMIN: [ROLE_ER_DOCTOR, ROLE_ER_NURSE, ROLE_RECEPTIONIST, ROLE_ADMIN_QUIROFANO, ROLE_HOSPITALIZATION]
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                default_target_path: app_dashboard
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            login_throttling:
                max_attempts: 4
                interval: '15 minutes'
            logout:
                path: app_logout
                # where to redirect after logout
                target: app_login
            custom_authenticators:
                - App\Security\GoogleAuthenticator

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # Public
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/verify/email$, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/verifications, roles: PUBLIC_ACCESS }
        - { path: ^/qr-code, roles: PUBLIC_ACCESS }
        - { path: ^/build, roles: PUBLIC_ACCESS }

        # User / External
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/forzar-cambio-clave, roles: ROLE_USER }
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/my_profile, roles: ROLE_EXTERNAL }
        - { path: ^/citas/solicitudes, roles: ROLE_EXTERNAL }

        # Admin Config / Master Data
        - { path: ^/admin/database, roles: ROLE_ADMIN }
        - { path: ^/auditoria, roles: ROLE_ADMIN }
        - { path: ^/empleado, roles: ROLE_ADMIN }
        - { path: ^/user_internal, roles: ROLE_ADMIN }
        - { path: ^/user_external, roles: ROLE_ADMIN }
        - { path: ^/ciudad, roles: ROLE_ADMIN }
        - { path: ^/ubicaciones, roles: ROLE_ADMIN }
        - { path: ^/estado, roles: ROLE_ADMIN }
        - { path: ^/municipio, roles: ROLE_ADMIN }
        - { path: ^/parroquia, roles: ROLE_ADMIN }
        - { path: ^/sector, roles: ROLE_ADMIN }
        - { path: ^/enfermedades, roles: ROLE_ADMIN }
        - { path: ^/alergenos, roles: ROLE_ADMIN }
        - { path: ^/medicamentos, roles: ROLE_ADMIN }
        - { path: ^/inmunizaciones, roles: ROLE_ADMIN }
        - { path: ^/discapacidades, roles: ROLE_ADMIN }
        - { path: ^/condiciones, roles: ROLE_ADMIN }
        - { path: ^/reacciones, roles: ROLE_ADMIN }
        - { path: ^/especialidades, roles: ROLE_ADMIN }
        - { path: ^/doctores, roles: ROLE_ADMIN }
        - { path: ^/consultorios, roles: ROLE_ADMIN }
        - { path: ^/area, roles: ROLE_ADMIN }
        - { path: ^/habitacion, roles: ROLE_ADMIN }
        - { path: ^/citas/configuraciones, roles: ROLE_ADMIN }
        - { path: ^/citas/estadisticas, roles: ROLE_ADMIN }
        - { path: ^/horario, roles: ROLE_ADMIN }
        - { path: ^/turno, roles: ROLE_ADMIN }

        # Common Medical Records Access
        - { path: ^/mi-perfil, roles: ROLE_INTERNAL }
        - { path: ^/paciente, roles: ROLE_INTERNAL }
        - { path: ^/historia/paciente, roles: ROLE_INTERNAL }
        - { path: ^/vitales, roles: ROLE_INTERNAL }
        - { path: ^/alergias, roles: ROLE_INTERNAL }
        - { path: ^/cama, roles: ROLE_INTERNAL }
        - { path: ^/hospitalizacioncama, roles: ROLE_INTERNAL }
        - { path: ^/zona/cama, roles: ROLE_INTERNAL }
        - { path: ^/citas, roles: ROLE_INTERNAL }

        # Modules
        - { path: ^/consulta, roles: ROLE_DOCTOR }
        - { path: ^/prescripciones, roles: ROLE_DOCTOR }
        - { path: ^/emergencia, roles: ROLE_ER }
        - { path: ^/hospitalizacion, roles: ROLE_HOSPITALIZATION }
        - { path: ^/visita, roles: ROLE_RECEPTIONIST }
        - { path: ^/cirugia, roles: ROLE_OR }
        - { path: ^/quirofano, roles: ROLE_ADMIN_QUIROFANO }
        - { path: ^/inventario, roles: ROLE_ADMIN_QUIROFANO }
        - { path: ^/articulo, roles: ROLE_ADMIN_QUIROFANO }
        - { path: ^/attachment, roles: ROLE_USER }

        # Global Default-Deny
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
